<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ruler Tournament — Scorer</title>
<style>
  :root{
    --surface:#1a1a19; --plane:#0d0d0d; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --base:#383835;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --o1:#7fb3d5; --o2:#6c9fc4; --o3:#598bb3; --o4:#4677a2; --o5:#336391;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);
       font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:14px;max-width:1180px;margin:0 auto}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  .card{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:13px 15px;margin-bottom:12px}
  .card h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .tile{flex:1 1 150px;background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:11px 13px}
  .lab{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .val{font-size:23px;font-weight:700;margin-top:3px;line-height:1.1}
  .sub2{font-size:11px;color:var(--muted);margin-top:3px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;
     padding:0 0 6px;font-weight:700;border-bottom:1px solid var(--base)}
  th:first-child,td:first-child{text-align:left}
  td{padding:7px 0;text-align:right;border-bottom:1px solid var(--grid);font-size:13px}
  tr:last-child td{border-bottom:none}
  .good{color:var(--good)} .warn{color:var(--warn)} .serious{color:var(--serious)} .crit{color:var(--crit)}
  .muted{color:var(--muted)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid}
  .note{font-size:11px;color:var(--muted);margin-top:9px;line-height:1.5}
  .bar{height:9px;border-radius:3px;background:var(--o3);display:inline-block;vertical-align:middle}
  .wrap{overflow-x:auto}
  .warnbox{border-color:var(--crit);background:#2a1414}
  .gates{display:flex;flex-wrap:wrap;gap:7px}
  .gate{font-size:11px;color:var(--ink2);border:1px solid var(--grid);border-radius:6px;padding:3px 8px}
  code{color:var(--ink2)}
</style>
</head>
<body>
<h1>Ruler Tournament — Scorer</h1>
<div class="sub" id="hdr">loading…</div>
<div id="app"></div>

<script>
const RAW="https://gist.githubusercontent.com/maltagamingstore/7f02dc27888b5de7ad0e7290128a4fe6/raw/scorer.json";
const GIST="https://api.github.com/gists/7f02dc27888b5de7ad0e7290128a4fe6";
const el=(h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;};
const n=(v,d=0)=>v===null||v===undefined?"—":Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const money=(v)=>{ if(v===null||v===undefined) return "—";
  // ALWAYS dollars. A cents glyph reads as dollars at a glance ("5.69¢" was misread as $5), and every
  // other figure on this page is dollars — one unit, no mental conversion.
  if(v===0) return "$0.00";
  const a=Math.abs(v);
  if(a<0.005) return (v<0?"-":"")+"<$0.01";      // non-zero but rounds to zero: say so, never show $0.00
  return (v<0?"-":"")+"$"+a.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); };
const pct=(v,d=1)=>v===null||v===undefined?"—":(100*v).toFixed(d)+"%";

// Sample-size honesty. This project's failures were confident arithmetic on samples too small to
// carry it, so every figure is rendered with its n and anything underpowered is LABELLED, not hidden.
function power(md){ if(md===null||md===undefined) return ["—","muted"];
  if(md>=30) return ["adequate","good"]; if(md>=10) return ["thin","warn"]; return ["UNDERPOWERED","crit"]; }

function render(d){
  const age=d.scan_age_s, stale=(age===null||age===undefined)?false:age>900;
  const acls=stale?"crit":"good";
  const atxt=(age===null||age===undefined)?"unknown":(age<90?Math.round(age)+"s ago":(age/60).toFixed(1)+" min ago");
  document.getElementById("hdr").innerHTML =
    '<b>LAST SCAN: <span class="'+acls+'">'+(d.scan_ts||"?")+" · "+atxt+(stale?" ▲ STALE":"")+'</span></b>'
    +'<br>feeder updated '+(d.updated||"?")+"  ·  spec "+(d.spec_hash||"?")
    +"  ·  aggregates only — no market names or positions"
    +(stale?'<br><span class="crit">The screener has not written in over 15 minutes — everything below describes a dead feed, not the market.</span>':"");
  const app=document.getElementById("app"); app.innerHTML="";
  const c=d.coverage||{}, g=d.gates||{};

  // ---- gates banner: the pre-registered commitments, shown NEXT TO the data they judge ----
  app.appendChild(el(`<div class="card"><h2>Standing commitments</h2><div class="gates">
    <span class="gate">seed $${n(g.seed_usd)}</span>
    <span class="gate">abandon at −${g.abandon_pct}%</span>
    <span class="gate">per-market cap ${g.exposure_cap_pct}%</span>
    <span class="gate">size target ${g.target_worst_frac}% of cap</span>
    <span class="gate">payout floor $${g.floor_usd_day}/day</span>
    <span class="gate">review: ${g.review_date||"—"}</span>
    <span class="gate">primary bar: ${g.primary_bar||"—"}</span></div></div>`));

  // ---- coverage ----
  const capped=(c.capped||[]).length>0;
  app.appendChild(el(`<div class="card ${capped?"warnbox":""}"><h2>Universe coverage</h2><div class="row">
    <div class="tile"><div class="lab">fetched</div><div class="val">${n(c.fetched)}</div><div class="sub2">$${n(c.pool_fetched)}/day</div></div>
    <div class="tile"><div class="lab">classified</div><div class="val">${n(c.classified)}</div><div class="sub2">${n(c.unclassified)} pending</div></div>
    <div class="tile"><div class="lab">calm</div><div class="val">${n(c.calm)}</div><div class="sub2">$${n(c.pool_calm)}/day</div></div>
    <div class="tile"><div class="lab">books read</div><div class="val">${n(c.screened)}</div><div class="sub2">$${n(c.pool_screened)}/day</div></div>
    <div class="tile"><div class="lab">scan</div><div class="val ${capped?"crit":"good"}">${capped?"▲ CAPPED":"✓ full"}</div>
      <div class="sub2">${capped?(c.capped||[]).join(", "):"stopped: "+(c.paging||"?")}</div></div>
  </div><div class="note">A cap that binds means the scan is incomplete — the strip turns red rather than quietly reporting a smaller universe.</div></div>`));

  // ---- placement A/B ----
  const p=d.placement||{};
  if(p.n){
    app.appendChild(el(`<div class="card"><h2>Placement A/B — shield vs touch <span class="muted">(identical holdings, 100% divergence)</span></h2>
      <div class="row">
      <div class="tile"><div class="lab">paired obs</div><div class="val">${n(p.n)}</div><div class="sub2">wall = ${n(p.wall)} sh</div></div>
      <div class="tile"><div class="lab">shield is a no-op</div><div class="val ${p.noop_pct>50?"serious":""}">${p.noop_pct}%</div><div class="sub2">wall_price returns the touch</div></div>
      <div class="tile"><div class="lab">reward forfeited</div><div class="val warn">${p.reward_forfeit_pct??"—"}%</div><div class="sub2">when it does engage (n=${n(p.n_moved)})</div></div>
      <div class="tile"><div class="lab">depth gained</div><div class="val">${p.depth_gain??"—"}×</div><div class="sub2">shares ahead of us</div></div>
      </div><div class="note">Paired per-row medians, never a ratio of medians — that error manufactured a 1.7× effect where the median row had none. Whether the trade is worth it depends on flatten latency, which is still unmeasured on the farmable set.</div></div>`));
  }

  // ---- shadow arm ----
  const sa=d.shadow_arm||{}, b=sa.base, s=sa.shadow;
  if(b||s){
    const mk=(k,a)=>{ if(!a) return `<tr><td>${k}</td><td colspan="6" class="muted">no data</td></tr>`;
      const [pw,cl]=power(a.mkt_days);
      return `<tr><td>${k}</td><td>${n(a.markets)}</td><td>${n(a.mkt_days,2)}</td>
        <td>${a.reward_per_mkt_day===null?"—":"$"+n(a.reward_per_mkt_day,3)}</td>
        <td>${n(a.gaps)}</td><td>${a.gap_rate_ci_hi===null?"—":"≤"+n(a.gap_rate_ci_hi,3)}</td>
        <td class="${cl}">${pw}</td></tr>`; };
    let ratio="";
    if(b&&s&&b.reward_per_mkt_day>0){
      const r=s.reward_per_mkt_day/b.reward_per_mkt_day;
      const weak=(s.mkt_days||0)<30;
      ratio=`<div class="note ${weak?"crit":""}">shadow / base reward = <b>${r.toFixed(1)}×</b>${weak?
        " — <b>NOT a finding.</b> Below 30 market-days this is noise; the prior from independent work is ~9.9×, and a large gap from it is a reason to distrust the reading, not to believe it.":""}</div>`;
    }
    app.appendChild(el(`<div class="card"><h2>Shadow paper arm <span class="muted">(measurement before money — DEC-0027)</span></h2>
      <div class="wrap"><table><thead><tr><th>arm</th><th>markets</th><th>mkt-days</th><th>$/mkt-day</th><th>tail events</th><th>rate 95% hi</th><th>power</th></tr></thead>
      <tbody>${mk("base (calm)",b)}${mk("shadow (news-banned)",s)}</tbody></table></div>${ratio}
      <div class="note">Thin-book snapshots (modeled share ≥25%) are excluded from both arms — the live bot refuses those books, so counting their reward would measure a trap. Tail rates show the Poisson upper bound: zero events is an upper bound, never proof of safety.</div></div>`));
  }

  // ---- per-ruler virtual portfolios ----
  const rp=d.ruler_pnl||{}, RR=rp.rulers||{};
  if(Object.keys(RR).length){
    const seed=rp.seed||1000;
    const nDead=Object.values(RR).filter(a=>a.dead).length;
    const rows=Object.keys(RR).map(k=>{const a=RR[k];
      const R=a.rejected||{};
      a.rej=["band","lifetime","info","shield"].filter(x=>R[x]>0).map(x=>x+" "+R[x]).join(", ");
      const st=a.dead?'<span class="crit">☠ DEAD</span>'
              :(a.floor_cleared?'<span class="good">✓ earning</span>':'<span class="warn">idle today</span>');
      const ut=a.util_pct>=50?"":(a.util_pct>=20?"warn":"crit");
      const fm=a.dead?'<span class="crit">0¢</span>':money(a.farmed);
      const F=(d.fills||{})[k]||{};
      const fmeta=(d.fills||{})._meta||{};
      const fc=fmeta.error?'<span class="crit">detector ERROR</span>'
              :(F.fills?(F.fill_net<0?'<span class="crit">':'<span class="good">')+money(F.fill_net)+'</span>'
                 +' <span class="muted">('+F.fills+'f · back '+money(F.net_back||0)+')</span>'
               :'<span class="muted">no fills yet</span>');
      const net=(a.farmed||0)+(F.fill_net||0);
      const nc=net<0?"crit":(net>0?"good":"muted");
      return `<tr><td>${k}</td><td>${a.held}</td><td>$${n(a.deployed)}</td>
        <td class="${ut}">${n(a.util_pct,1)}%</td><td>$${n(a.rew_day_raw,2)}</td>
        <td>${n(a.pct_time_paid,0)}%</td><td>${fm}</td><td>${fc}</td><td class="${nc}">${money(net)}</td><td class="muted">${a.rej||"—"}</td><td>${st}</td></tr>`;}).join("");
    // ---- CURRENT CAPITAL (added 2026-08-08) ----
    const C=d.capital||{}, CR=C.rows||{};
    if(Object.keys(CR).length){
      const crows=Object.keys(CR).sort((a,b)=>CR[a].capital-CR[b].capital).map(k=>{
        const v=CR[k], dd=v.drawdown_pct;
        const cls=v.abandoned?"crit":(dd<0?"warn":(dd>0?"good":"muted"));
        return `<tr><td>${k}</td><td>$${n(v.seed,0)}</td><td>${money(v.farmed)}</td>
          <td>${money(v.fill_pnl)}</td><td class="${cls}"><b>$${n(v.capital,2)}</b></td>
          <td class="${cls}">${dd>=0?"+":""}${n(dd,3)}%</td>
          <td class="muted">$${n(v.capital_back,2)} .. $${n(v.capital_front,2)}</td>
          <td>${v.abandoned?'<span class="crit">☠ ABANDONED</span>':'<span class="good">alive</span>'}</td></tr>`;}).join("");
      app.appendChild(el(`<div class="card"><h2>Current capital
        <span class="muted">· seed $${n(C.seed,0)} each · abandon at −${n(C.abandon_pct,0)}%</span></h2>
        <div class="wrap"><table><thead><tr><th>ruler</th><th>seed</th><th>reward farmed</th>
        <th>fill P&amp;L</th><th>CAPITAL</th><th>drawdown</th><th>queue interval</th><th>gate</th></tr></thead>
        <tbody>${crows}</tbody></table></div>
        <div class="note"><b>capital = seed + reward farmed + fill P&amp;L</b> (fill P&amp;L at the pro-rata
        expectation; the grey interval is the back..front queue range). <b>This did not exist until
        2026-08-08</b>, and its absence mattered: the abandonment criterion is "45% of capital lost", but the
        only capital-ish number published was <code>ret_on_seed_pct</code> = reward-per-day ÷ seed — a reward
        RATE that ignores fill P&amp;L entirely and can only ever go up. A gate defined on capital loss was
        reading a number that could not fall, so it could never fire no matter how much an arm bled.
        Abandonment is judged on the EXPECTATION, not the worst-case tail — retiring an arm for its unlucky
        end of the queue interval would kill strategies for bad luck. Reward is still MODELLED and ran ~2×
        hot historically, so capital is only as calibrated as the reward half of it.</div></div>`));
    }

    app.appendChild(el(`<div class="card"><h2>Ruler P&amp;L — each runs its own $${n(seed)}
      <span class="muted">· ${n(rp.rulers?Object.values(RR)[0].obs_days:0,2)} days observed</span></h2>
      <div class="wrap"><table><thead><tr><th>ruler</th><th>held</th><th>deployed</th><th>util</th>
      <th>$/day rate</th><th>% time paid</th><th>REWARD FARMED</th><th>fill P&amp;L</th><th>NET</th><th>rejected by</th><th>status</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      ${(function(){const E=d.expect||{};const ks=Object.keys(E);if(!ks.length)return"";
        return `<div class="note"><b>PRE-REGISTERED EXPECTATIONS.</b> Every arm states what we expect
        BEFORE reading it, so a surprise is a finding rather than a story told afterwards. Two arms are
        deliberate NEGATIVE CONTROLS whose job is to lose — <code>R7_all_vetoes</code> and
        <code>RK_kappa_copy</code>. If either wins, distrust the scorer, not the vetoes.
        <div class="wrap"><table><thead><tr><th>arm</th><th>what we expect, and what a surprise means</th>
        </tr></thead><tbody>${ks.map(k=>`<tr><td><b>${k}</b></td><td class="muted">${E[k]}</td></tr>`).join("")}
        </tbody></table></div></div>`;})()}
      ${nDead?`<div class="note crit"><b>☠ ${nDead} of ${Object.keys(RR).length} rulers are DEAD.</b>
      Polymarket forfeits the ENTIRE day's reward if the book totals under $1 across all bets. A ruler
      projecting $0.16/day banks <b>zero every day, forever</b>, while still carrying full fill and tail
      risk — its expected P&amp;L is not "small", it is strictly negative by construction. Dead is a
      structural verdict, not a low score: the veto stack cannot assemble a book that clears the floor.</div>`:""}
      <div class="note"><b>REWARD FARMED</b> is the benchmark — cumulative $ actually banked (floored rate
      integrated over observed time), which is what any future loss gets measured against. <b>% time paid</b>
      is the share of cycles the book cleared $1/day. <b>Idle capital is a real cost</b>: a ruler holding one
      market deploys ~10% and leaves the rest dead. Reward is MODELLED and the model ran ~2× hot historically
      and is still uncalibrated — valid for ranking rulers against each other, not as a dollar forecast.
      <b>Fill P&amp;L</b> is now measured from REAL public trade prints joined to our 12s book snapshots
      (<code>fill_marks.py</code>), not inferred from book movement. Each row shows the FRONT-of-queue bound;
      the <span class="muted">grey</span> figure beside it is the BACK-of-queue bound. The headline number
      is now the <b>PRO-RATA EXPECTATION</b>: our share of the level is clip/(depth_ahead+clip), and a sweep
      of size S gives us that share of S, capped at our clip. The venue matches price-time, not pro-rata —
      but this project already established that off-chain matching makes queue position UNOBSERVABLE, and
      with our position unknown and uniform inside the level, the pro-rata share IS the expected fill under
      price-time. So front/back remain the honest extremes and the headline is the expectation between them.
      <b>It lands near the pessimistic end</b> (−$4.27 expected vs −$3.72 front, −$4.31 back): the big sweeps
      that hurt still reach us, while the small favourable fills scale down with our share. Costed as (mid at +1800s − fill price) × size,
      horizon pre-registered.
      <br><br><b>ONE EXIT POLICY, IDENTICAL FOR EVERY ARM</b> (<code>exit_policy.py</code>,
      <code>exit-v1:wait1800/merge-immediate/flatten-touch</code>). Merge the instant a YES+NO pair exists;
      hold a one-sided bag up to <b>1800s</b> hoping the second leg fills so the pair merges free; on timeout
      flatten at the touch. Pinned so that a P&amp;L difference between arms is attributable to SELECTION —
      exit was previously unmodelled, and we measured that it decides the <i>sign</i>.
      Derived from <b>8,056 real fills / 82 markets</b>: P(pair) 27.1% @60s · 49.5% @300s · 68.3% @900s ·
      78.0% @1800s · 87.0% @3600s; EV/fill −$0.235 @60s → +$0.104 @1800s. Going flat fast is the worst
      available choice. 1800s (not the better-scoring 3600s) because the curve never turns over, so the data
      identifies no interior optimum and 1800s was pre-registered before these numbers existed. NOT priced:
      capital lock, forgone reward while holding a bag, and tail risk growing with holding time — all three
      argue for waiting less.
      <br><br><b>⚠ THE BOT DOES NOT RUN THIS POLICY YET.</b> We are in SIMULATION only —
      <code>mm_bot.py</code> contains zero references to <code>exit_policy</code> and has no timed hold at
      all (it merges immediately, then relies on quote skew, flattening only on triggers: 6 adverse fills,
      2 days to resolution, or the −30% catastrophe floor). So the bot can hold a bag far LONGER than 1800s,
      past anything we have measured. Wiring the policy into the bot is a <b>pre-live gate item
      (TASK-0021)</b>, deliberately deferred: we learn the right constant here first, then upgrade the bot
      immediately before going live.
      <br><br><b>⚠ OUR SELECTION PAIRS AT 0%.</b> The 82-market population merges 78% of fills at 1800s; the
      markets our rulers actually hold merged <b>0 of 11</b> — three of four got fills on ONE side only, and
      the fourth's two legs came 32 min apart, just past the policy. One-sided flow is adverse selection in
      its purest form, and it means the merge economics that make farming work are not reaching our picks.
      <br><br><b>EXIT WALKS THE BOOK.</b> The first version sold the whole clip at the touch price, which
      assumes an infinitely deep counterparty. Measured 2026-08-09: 3 of 13 marks were &gt;25% of the size
      resting at the touch and one needed <b>31 shares against 5</b> — and that one was reporting a clean
      $0.00. A sale always fills if you accept a worse price, so we now take the worse price instead of
      leaving it unpriced: sell into the touch, then one TICK worse per further touch-full of size. The
      ladder below the touch is NOT observed (we record top-of-book only) and is assumed uniform — a model,
      not a measurement, conservative by construction. Cost across arms: −$4.26 → <b>−$4.97</b>.
      <br><br><b>EXIT MODE = "touch" (realized), not "mid" (paper).</b> A fill is costed by FLATTENING —
      selling at the bid / buying at the ask — because that is what happens when you go flat instead of
      MERGING. Marking to the mid assumes a costless exit that nobody gets. On the first 11 marks the two
      disagree by $3.22 <i>and disagree in sign</i>: +$2.29 marked to mid vs −$0.93 flattened, and −$2.04 at
      30s. Going flat fast is the expensive case, which matches the live experience this project recorded.
      Merging (YES+NO → $1) pays no spread and is a THIRD case, not modelled here: historically only
      <b>43% of filled windows were balanced enough to merge</b> (74/171), and merge rescued that quadrant
      completely (−$14.14 → +$0.70/mkt/day, 98% positive) while doing nothing for the directional one
      (−$19.55, unchanged). So this column is the DIRECTIONAL/no-merge cost.
      <br><br><b>READ THE BOUNDS BY SIGN.</b> FRONT is simply the MOST fills, BACK the FEWEST — that is a bound
      on VOLUME, not on loss. While fill P&amp;L is negative, FRONT is the pessimistic case; while it is
      POSITIVE, FRONT is the <i>optimistic</i> one and BACK is the conservative read. Today the two disagree
      by 4×, and most arms fill zero times at the back of the queue, so the back column is the number to
      trust when this panel looks good.
      <br><br><b>CORRECTED 2026-08-08 — this panel used to read "0 fills", and that was wrong.</b> The old
      detector fired only when <code>best_ask ≤ our_bid</code>, i.e. the ask side collapsing THROUGH our level.
      A taker hitting a resting BID consumes BID depth and leaves the ask untouched, so it was blind to the
      ordinary fill: 0 raw detections across 222,763 snapshots on the held markets, while trade prints showed
      real fills in the same markets. That old rule is still published as <code>gap_through</code> — it is a
      genuine tail-risk signal, it is just not "fills".</div></div>`));
  }

  // ---- THE 13 FARMERS (2026-08-11) ----
  const WH=d.whales||{}, WR=WH.rows||[];
  if(WR.length){
    const wrows=WR.map(w=>{
      const bk=(w.unrealized==null)?'<span class="muted">?</span>'
        :(w.unrealized>0?'<span class="good">GREEN</span>':'<span class="crit">RED</span>');
      const eff=(w.reward_usd&&w.n_pos)?(w.reward_usd/w.n_pos):null;
      return `<tr><td>${w.rank}</td>
        <td><b>${w.name}</b></td>
        <td><a href="https://polymarket.com/profile/${w.addr}" target="_blank" rel="noopener">${w.addr.slice(0,10)}…</a></td>
        <td>$${n(w.reward_usd||0,0)}</td><td>${w.n_pos==null?'?':n(w.n_pos,0)}</td>
        <td>${w.unrealized==null?'?':money(w.unrealized)}</td><td>${bk}</td>
        <td>${w.red_pct==null?'?':n(w.red_pct,0)+'%'}</td>
        <td>${w.merge_pct==null?'?':n(w.merge_pct,1)+'%'}</td>
        <td class="muted">${w.question||'—'}</td>
        <td>${w.answer==null?'<span class="muted">—</span>':n(w.answer,2)}</td></tr>`;}).join("");
    app.appendChild(el(`<div class="card"><h2>The 13 farmers
      <span class="muted">· re-confirmed ${WH.asof||'never'}</span></h2>
      <div class="wrap"><table><thead><tr><th>#</th><th>name</th><th>wallet</th><th>reward/day</th>
      <th>pos</th><th>unrealized</th><th>book</th><th>red</th><th>merge</th>
      <th>daily question</th><th>answer</th></tr></thead><tbody>${wrows}</tbody></table></div>
      <div class="note">Found by harvesting the on-chain reward distributor
      (<code>0xd152f549…</code>) — <b>2,455 wallets were paid in a single day</b>, and these are the 13
      above $1,000/day. Names are <b>pinned to addresses, not ranks</b> (ranks move daily).
      <b>alpha</b> is the one we found first (rank #3), and <code>RW_whale_copy</code> copies HIS market
      selection. Every dossier claim names one number — the <b>daily question</b> — which
      <code>whale_daily.py</code> re-measures each day so a stale note is visible rather than merely
      wrong. On day one it caught its own author: alpha was described as the heaviest merger, and
      nu&nbsp;18.7%, gamma&nbsp;16.4% and iota&nbsp;13.9% all merge more.
      <br><br><b>⚠ Book health is NOT capital efficiency.</b> theta has the best book (+$97k) but runs
      ~$944k of basis — 0.14%/day, versus alpha's 8.05%. The efficiency leaders are
      <b>kappa 14.50%, lambda 14.35%, delta 12.76%</b>, all with small books and near-zero merge rates.
      Wallet links open the Polymarket profile.</div></div>`));
  }

  // ---- rulers + divergence ----
  const R=d.rulers||{}, keys=Object.keys(R);
  if(keys.length){
    const max=Math.max(1,...keys.map(k=>R[k]));
    const rows=keys.map(k=>`<tr><td>${k}</td><td>${R[k]}</td>
      <td style="text-align:left"><span class="bar" style="width:${Math.max(3,150*R[k]/max)}px"></span></td></tr>`).join("");
    const dv=(d.divergence||[]).slice().sort((x,y)=>y.d-x.d);
    const dvr=dv.map(x=>{const cl=x.d===0?"crit":(x.d>=5?"good":"warn");
      const v=x.d===0?"identical — no information":(x.d>=5?"decidable":"thin");
      return `<tr><td>${x.a.split("_")[0]} vs ${x.b.split("_")[0]}</td><td>${x.d}</td><td class="${cl}">${v}</td></tr>`;}).join("");
    app.appendChild(el(`<div class="card"><h2>Selection rulers — holdings &amp; divergence</h2>
      <div class="wrap"><table><thead><tr><th>ruler</th><th>holds</th><th style="text-align:left">&nbsp;</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="note">A pair only carries information where the rulers <i>disagree</i>. Pairs at 0 are being compared on nothing.</div>
      <div class="wrap" style="margin-top:10px"><table><thead><tr><th>pair</th><th>divergent</th><th style="text-align:right">verdict</th></tr></thead><tbody>${dvr}</tbody></table></div></div>`));
  }
}

async function load(){
  let d=null;
  try{ const r=await fetch(RAW+"?t="+Date.now(),{cache:"no-store"}); if(r.ok) d=await r.json(); }catch(e){}
  if(!d){ try{
      const r=await fetch(GIST,{headers:{"Accept":"application/vnd.github+json"},cache:"no-store"});
      const j=await r.json(); const f=j.files&&j.files["scorer.json"];
      let t=f?f.content:null;
      if(f&&f.truncated){ const rr=await fetch(f.raw_url,{cache:"no-store"}); t=await rr.text(); }
      if(t) d=JSON.parse(t);
    }catch(e){} }
  if(!d){ document.getElementById("hdr").innerHTML='<span class="crit">NO DATA — the scorer feeder has not published yet.</span>'; return; }
  render(d);
}
load(); setInterval(load,120000);
</script>
