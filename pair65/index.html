<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pair-65 Test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --bg:#0c141c; --card:#141f2b; --ink:#dce7f0; --muted:#8098ab;
    --line:#243645; --accent:#3ec2f0;
    --good:#35d39a; --good-bg:#0e2a24; --warn:#f0b54a; --warn-bg:#2b2411;
    --bad:#f4708e; --bad-bg:#2c1520;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;padding:16px 14px 40px;max-width:560px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .top h1{font-size:15px;margin:0;font-family:var(--mono);letter-spacing:.02em;font-weight:600;color:var(--muted)}
  .badge{font-family:var(--mono);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .up{background:var(--good-bg);color:var(--good)} .up .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
  .down{background:var(--bad-bg);color:var(--bad)} .down .dot{background:var(--bad)}
  .fresh{font-family:var(--mono);font-size:11px;color:var(--muted);margin:0 0 14px}
  .stale{color:var(--warn)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .big{font-size:26px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
  .hero .big{font-size:42px}
  .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .grid4 .card{padding:10px 8px;text-align:center;margin:0}
  .grid4 .big{font-size:20px}
  .grid4 .lbl{margin-bottom:5px;letter-spacing:.08em}
  .g{color:var(--good)} .b{color:var(--bad)} .w{color:var(--warn)} .m{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
  th{text-align:left;color:var(--muted);font-weight:600;padding:4px 4px;border-bottom:1px solid var(--line);
     font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
  td{padding:5px 4px;border-bottom:1px solid #1b2836;font-variant-numeric:tabular-nums}
  .scroll{overflow-x:auto}
  .note{font-size:11px;color:var(--muted);line-height:1.55;font-family:var(--mono)}
  .err{background:var(--bad-bg);color:var(--bad);padding:14px;border-radius:12px;font-family:var(--mono);font-size:12px}
  a{color:var(--accent);text-decoration:none;font-family:var(--mono);font-size:11px}
</style>
</head>
<body>
<div class="top">
  <h1>PAIR-65 · BTC 5-MIN</h1>
  <span id="badge" class="badge down"><span class="dot"></span>loading</span>
</div>
<p class="fresh" id="fresh">connecting…</p>
<div id="root"></div>
<p style="margin-top:18px"><a href="../probe/">← probe</a> · <a href="../bot/">mm_bot →</a></p>

<script>
const GIST="https://api.github.com/gists/7f02dc27888b5de7ad0e7290128a4fe6";
const RAW="https://gist.githubusercontent.com/maltagamingstore/7f02dc27888b5de7ad0e7290128a4fe6/raw/pair65.json";
const $=id=>document.getElementById(id);
const usd=v=>(v==null?"–":(v<0?"-":"+")+"$"+Math.abs(v).toFixed(2));
const c1=v=>(v==null?"–":(v>0?"+":"")+v.toFixed(1)+"¢");

function render(d){
  const up=d.bot_up && !d.killed;
  $("badge").className="badge "+(up?"up":"down");
  $("badge").innerHTML=`<span class="dot"></span>${d.killed?"KILLED":(up?"RUNNING":"STOPPED")}`;
  const age=d.log_age_s;
  $("fresh").innerHTML=`updated ${d.updated||"–"} · log ${age==null?"–":age+"s"} old`
    + (age!=null&&age>300?` <span class="stale">(stale)</span>`:"");

  const n=d.n||0;
  const pnl=d.pnl_est, killDist=(d.kill!=null&&pnl!=null)?(d.kill+Math.min(0,pnl)+Math.max(0,pnl)) : null;
  let h="";

  // hero: running P&L vs the -$10 kill
  h+=`<div class="card hero"><div class="lbl">est P&L (${n} trade${n==1?"":"s"}) · kill at -$10</div>
      <div class="big ${pnl>0?"g":(pnl<0?"b":"")}">${usd(pnl)}</div>
      <div class="sub">equity ${d.equity==null?"–":"$"+d.equity.toFixed(2)} · cash ${d.cash==null?"–":"$"+d.cash.toFixed(2)}
      · open orders ${d.open_orders==null?"–":d.open_orders}</div></div>`;

  // counts
  h+=`<div class="grid4">
    <div class="card"><div class="lbl">trades</div><div class="big">${n}</div></div>
    <div class="card"><div class="lbl">win</div><div class="big g">${d.win??"–"}</div></div>
    <div class="card"><div class="lbl">stop</div><div class="big w">${d.stop??"–"}</div></div>
    <div class="card"><div class="lbl">gap</div><div class="big b">${d.gap??"–"}</div></div>
  </div>`;

  // win rate vs needed vs replay benchmark
  const wp=d.win_pct;
  h+=`<div class="card"><div class="lbl">one-sided win rate</div>
      <div class="big ${wp==null?"":(wp>=d.needed_pct?"g":"b")}">${wp==null?"–":wp+"%"}</div>
      <div class="sub">needs ≥ ${d.needed_pct}% to break even · replay said ${d.bench_pct}% (unproven)
      ${n<10?" · <span class='w'>n too small for any verdict</span>":""}</div></div>`;

  // THE two numbers this test exists for
  h+=`<div class="grid">
    <div class="card"><div class="lbl">entry slippage (vs quoted ask)</div>
      <div class="big">${c1(d.entry_slip_avg_c)}</div>
      <div class="sub">worst ${c1(d.entry_slip_max_c)}</div></div>
    <div class="card"><div class="lbl">stop slippage (vs quote at trigger)</div>
      <div class="big">${c1(d.stop_slip_avg_c)}</div>
      <div class="sub">worst ${c1(d.stop_slip_max_c)} · sell ${d.stop_kinds?.sell??0} / merge ${d.stop_kinds?.merge??0}</div></div>
  </div>`;

  if(d.state_line) h+=`<div class="card"><div class="lbl">bot state</div><div class="note">${d.state_line}</div>
    ${d.last_signal?`<div class="note" style="margin-top:6px">${d.last_signal}</div>`:""}
    ${d.last_kill_strike?`<div class="note w" style="margin-top:6px">${d.last_kill_strike}</div>`:""}</div>`;

  // trade table
  if(d.recent&&d.recent.length){
    h+=`<div class="card"><div class="lbl">trades (newest first)</div><div class="scroll"><table>
      <tr><th>time</th><th>win</th><th>side</th><th>entry q→f</th><th>stop</th><th>p&l</th></tr>`;
    for(const r of d.recent){
      const stop=r.k?`${r.k} ${r.sq==null?"":r.sq.toFixed(2)}→${r.sf==null?"":r.sf.toFixed(2)}`:"–";
      const cls=r.o==="win"?"g":(r.o==="gap_loss"?"b":"w");
      h+=`<tr><td>${r.ts}</td><td>${r.t}</td><td>${(r.s||"").toUpperCase()}</td>
        <td>${r.eq==null?"–":r.eq.toFixed(2)}→${r.ef==null?"–":r.ef.toFixed(2)}</td>
        <td>${stop}</td><td class="${cls}">${usd(r.p)}</td></tr>`;
    }
    h+=`</table></div></div>`;
  } else {
    h+=`<div class="card"><div class="note">No live trades yet. The bot enters when either side's mid
        reaches 64–66¢ with ≥60s left in the window; stops if it touches 35¢.</div></div>`;
  }

  h+=`<div class="card"><div class="lbl">what this test measures</div><div class="note">
      Taker-buy 5sh of the BTC 5-min leader at ~65¢ → ride to $1.00 (+~$1.72) or merge-stop at 35¢
      (−~$1.90). Replay EV +4.6¢/sh is UNPROVEN — this page's real deliverables are the two slippage
      numbers, which decide if any band is playable. One trade at a time · max 40 trades · −$10 kill.
      </div></div>`;

  $("root").innerHTML=h;
}

async function load(){
  // raw CDN first: no 60/hr API rate limit (the API path froze the page after ~45 min of polling)
  try{
    const r=await fetch(RAW+"?t="+Date.now(),{cache:"no-store"});
    if(r.ok){ render(await r.json()); return; }
    throw new Error("raw HTTP "+r.status);
  }catch(e1){
    try{
      const r=await fetch(GIST,{headers:{"Accept":"application/vnd.github+json"},cache:"no-store"});
      if(!r.ok) throw new Error("gist HTTP "+r.status);
      const g=await r.json();
      const file=g.files&&g.files["pair65.json"];
      if(!file) throw new Error("pair65.json not in gist yet — start pair65_push.py");
      let txt=file.content;
      if(file.truncated){ const rr=await fetch(file.raw_url,{cache:"no-store"}); txt=await rr.text(); }
      render(JSON.parse(txt));
    }catch(e){
      $("root").innerHTML=`<div class="err">${e1.message} · ${e.message}</div>`;
    }
  }
}
load();
setInterval(load,45000);
</script>
</body>
</html>
